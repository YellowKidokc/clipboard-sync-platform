name: Typecheck

on:
  pull_request:
  push:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [client, server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
