services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clipsync
      POSTGRES_USER: clipsync
      POSTGRES_PASSWORD: clipsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    environment:
      DATABASE_URL: postgresql://clipsync:clipsync@postgres:5432/clipsync
      JWT_SECRET: change-me
      PORT: 5000
      BLOB_STORAGE_PATH: /data/blobs
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - blobs:/data/blobs
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
    ports:
      - "4173:4173"
    depends_on:
      - server
volumes:
  pgdata:
  blobs:
